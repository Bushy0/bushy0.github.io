<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bushy Tools | Refine Calculator</title>

    <link rel="stylesheet" href="./styles/styles.css">

    <link rel="icon" href="./images/LogoTitle.png" type="image/x-icon">

    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">

    <meta property="og:url" content="https://bushy0.github.io/refine">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Bushy Refine">
    <meta property="og:description" content="Albion Online refining calculator.">
    <meta property="og:image" content="https://bushy0.github.io/images/Bushy4k.png">

    <meta name="twitter:title" content="Bushy Refine">
    <meta name="twitter:card" content="summary_large_image">
    <meta property="twitter:domain" content="https://bushy0.github.io">
    <meta property="twitter:url" content="https://bushy0.github.io/refine">
    <meta name="twitter:description" content="Albion Online refining calculator.">
    <meta name="twitter:image" content="https://bushy0.github.io/images/Bushy4k.png">

    <meta name="theme-color" content="#69A891">

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="/index" class="nav-brand">

                <img src="./images/LogoTitle.png" alt="Bushy" class="nav-logo">

                <span>
                    Bushy Tools
                </span>

            </a>

            <div class="nav-links">

                <a href="/index">
                    Home
                </a>

                <a href="/zvzlootsplit">
                    ZVZ Loot Split
                </a>

                <a href="/refine" class="active">
                    Refine Calculator
                </a>

            </div>

        </div>

    </nav>

    <main class="page-container">

        <header class="page-header">

            <h1>
                Refining Calculator
            </h1>

            <p>
                Calculate the raw materials needed
                for refining.
            </p>

        </header>

        <section class="refine-card">

            <div class="refine-field">

                <label for="tierSelect">
                    Select Tier
                </label>

                <select id="tierSelect">

                    <option value="T2">
                        T2
                    </option>

                    <option value="T3">
                        T3
                    </option>

                    <option value="T4">
                        T4
                    </option>

                    <option value="T5">
                        T5
                    </option>

                    <option value="T6">
                        T6
                    </option>

                    <option value="T7">
                        T7
                    </option>

                    <option value="T8">
                        T8
                    </option>

                </select>

            </div>

            <div class="refine-field">

                <label for="amountInput">
                    Amount to Refine
                </label>

                <input type="number" id="amountInput" placeholder="Enter amount to refine" min="0" inputmode="numeric">

                <span id="minForOne" class="input-help"></span>

            </div>

            <button type="button" id="calculateButton">
                Calculate
            </button>

        </section>

        <section id="results" class="refine-results">

            <div class="results-header">

                <h2>
                    Raw Materials Required
                </h2>

            </div>

            <div id="rawMaterialsList" class="materials-list">

                <p>
                    Enter an amount and calculate
                    your required materials.
                </p>

            </div>

        </section>

    </main>

    <script src="./js/refineMini.js"></script>

</body>

</html>
