<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bushy Tools | ZvZ Loot Split</title>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/lootsplit.css">
    <link rel="icon" href="./images/LogoTitle.png" type="image/x-icon">

    <link href="https://unpkg.com/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">

    <meta property="og:url" content="https://bushy0.github.io/zvzlootsplit">
    <meta property="og:type" content="website">
    <meta property="og:title" content="ZvZ Loot Split">
    <meta property="og:description" content="ZvZ Loot Split Calculator">
    <meta property="og:image" content="https://bushy0.github.io/images/Bushy4k.png">

    <meta name="twitter:title" content="ZvZ Loot Split">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:description" content="ZvZ Loot Split Calculator">
    <meta name="twitter:image" content="https://bushy0.github.io/images/Bushy4k.png">

    <meta name="theme-color" content="#69A891">

</head>

<body>

    <nav class="navbar">

        <div class="nav-container">

            <a href="/index" class="nav-brand">

                <img src="./images/LogoTitle.png" alt="Bushy" class="nav-logo">

                <span>
                    Bushy Tools
                </span>

            </a>

            <div class="nav-links">

                <a href="/index">
                    Home
                </a>

                <a href="/zvzlootsplit" class="active">
                    ZVZ Loot Split
                </a>

                <a href="/refine">
                    Refine Calculator
                </a>

            </div>

        </div>

    </nav>

    <main class="page-container">

        <header class="page-header">

            <h1>
                ZvZ Loot Split Calculator
            </h1>

            <p>
                Divide loot based on guild attendance.
            </p>

        </header>

        <section class="loot-card">

            <label for="splitValue">
                Value of Split
            </label>

            <input type="text" id="splitValue" value="0" inputmode="numeric" autocomplete="off">

        </section>

        <section id="guildInputs" class="guild-list"></section>

        <div class="button-container">

            <button type="button" id="addGuild">

                <i class="bx bx-plus"></i>

                Add Guild

            </button>


        </div>

        <section id="splitResults">

            <div class="results-header">

                <h2>
                    Split Results
                </h2>

                <button type="button" id="copyResultsButton">

                    <i class="bx bx-copy"></i>

                    Copy Results

                </button>

            </div>

            <p>
                Enter a loot value and at least one
                attendance value.
            </p>

        </section>

    </main>

    <script src="./js/zvzlootsplitMini.js"></script>

</body>

</html>
